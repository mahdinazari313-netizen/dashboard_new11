name: Build MT5 Dashboard v15 APK

on:
  push:
    branches: [ v15-build-20260923 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout v15 build branch
        uses: actions/checkout@v4

      - name: Verify v15 source archive
        shell: bash
        run: |
          echo "159075c0750ceaa891eb20df8c12c4f7e742511a868686115a9bc95aa57c3dde  MT5Dashboard-v15-FINAL.zip" | sha256sum -c -

      - name: Extract v15 source
        shell: bash
        run: |
          rm -rf v15-source
          unzip -q MT5Dashboard-v15-FINAL.zip -d v15-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Configure Android SDK location
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > v15-source/MT5Dashboard/mt5dashboard/local.properties

      - name: Build v15 debug APK
        working-directory: v15-source/MT5Dashboard/mt5dashboard
        run: gradle --no-daemon clean assembleDebug

      - name: Upload v15 APK
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-new11-v15-final-apk
          path: v15-source/MT5Dashboard/mt5dashboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
